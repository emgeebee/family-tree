name: CI and deploy Pages

# Every branch and pull request is linted and built (with .env.dev and
# .env.prod) so problems show up before merging. Pushes to main build with
# .env.prod and publish to GitHub Pages.
on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IS_MAIN_PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci

      - run: npm run lint

      # Each build reads .env.<mode> and fails if the OAuth client id or API URL is missing.
      - name: Build (dev)
        if: env.IS_MAIN_PUSH != 'true'
        run: npm run build:dev

      - name: Build (prod)
        run: npm run build:prod

      - name: Upload Pages artifact
        if: env.IS_MAIN_PUSH == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
